<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Einladung – Who Drives?</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 20px; line-height: 1.6; max-width: 36rem; margin: 0 auto; padding: 1.5rem; color: #1F2328; background: #E8EAED; }
  h1 { font-size: 1.8rem; line-height: 1.3; }
  li { margin-bottom: 1.5rem; }
  .button { display: block; text-align: center; background: #3B4BC8; color: #fff; text-decoration: none; font-weight: 700; padding: 1rem; border-radius: 14px; margin-top: .5rem; }
  .code { font-size: 2.6rem; font-weight: 700; letter-spacing: .2rem; text-align: center; background: #F4F5F7; border-radius: 14px; padding: .5rem; margin-top: .5rem; }
</style>
</head>
<body>
<!-- Invitation link from the app: app.html#CODE. The code is only read in the browser
     (after '#', never sent to the server). -->
<h1>Du bist zu „Who Drives?“ eingeladen</h1>
<ol>
  <li>App installieren:
    <a class="button" id="store" href="https://play.google.com/store/apps/details?id=com.michael_stoecker.whodrives">Bei Google Play laden</a>
    <p id="ios-soon" hidden>Für das iPhone kommt die App bald in den App Store.</p>
  </li>
  <li>App öffnen und mit deiner E-Mail-Adresse anmelden.</li>
  <li><span id="code-intro">Den Einladungscode aus der Nachricht eingeben.</span>
    <div class="code" id="code" hidden></div>
  </li>
</ol>
<script>
  // Empty until the app is in the App Store, then e.g. 'https://apps.apple.com/app/id123456789'
  var APP_STORE_URL = '';

  var code = decodeURIComponent(location.hash.slice(1)).toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length === 8) {
    document.getElementById('code-intro').textContent = 'Diesen Einladungscode eingeben:';
    var box = document.getElementById('code');
    box.textContent = code.slice(0, 4) + '-' + code.slice(4);
    box.hidden = false;
  }

  if (/iPhone|iPad|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
    var store = document.getElementById('store');
    if (APP_STORE_URL) {
      store.href = APP_STORE_URL;
      store.textContent = 'Im App Store laden';
    } else {
      store.hidden = true;
      document.getElementById('ios-soon').hidden = false;
    }
  }
</script>
</body>
</html>
